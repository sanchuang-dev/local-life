# A GitHub Pages repository has one site. Publish dev at the existing root
# and the separately built prod branch under /prod/ in one atomic artifact.
# The source for the production showcase is always the prod branch.
#
# dev is already a pnpm workspace. prod may still be the legacy single-package
# layout until it is promoted, so the prod build keeps a documented fallback.
name: Local Life Pages (Dev and Prod)

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-life-dev-preview
  cancel-in-progress: false

jobs:
  # Production source updates must refresh the shared Pages artifact, but
  # this repo's github-pages environment only admits deployments from dev.
  # GITHUB_TOKEN workflow_dispatch is an explicitly supported GitHub Actions
  # event; it re-runs the reviewed dev workflow, which reads prod source.
  request-pages-on-prod:
    if: github.event_name == 'push' && github.ref_name == 'prod'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the dev Pages publisher after prod changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/preview.yml/dispatches" \
            -f ref=dev

  build:
    # The github-pages environment allows deployment from dev only.
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source
          persist-credentials: false

      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod-source
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: dev-source/pnpm-lock.yaml

      - name: Check and build development preview
        working-directory: dev-source
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Check and build production showcase from prod
        working-directory: prod-source
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ] && [ -f apps/web/package.json ]; then
            echo "prod source is a pnpm workspace"
            pnpm install --frozen-lockfile
            pnpm --filter @sanchuang-dev/local-life-web build:prod-preview
          else
            echo "prod source is the legacy single-package layout"
            npm ci --no-audit --no-fund
            npm run check
            # --base keeps the prod showcase under /local-life/prod/ even
            # before the prod branch is promoted to the monorepo layout.
            npx vite build --base /local-life/prod/
          fi

      - name: Assemble both environments in one Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -d prod-source/apps/web/dist ]; then
            prod_dist=prod-source/apps/web/dist
          else
            prod_dist=prod-source/dist
          fi
          test -f dev-source/apps/web/dist/index.html
          test -f "$prod_dist/index.html"
          mkdir -p pages-site/prod
          cp -a dev-source/apps/web/dist/. pages-site/
          cp -a "$prod_dist/." pages-site/prod/
          touch pages-site/.nojekyll
          test -f pages-site/index.html
          test -f pages-site/prod/index.html
          grep -q '/local-life/prod/assets/' pages-site/prod/index.html
          grep -q '/local-life/assets/' pages-site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
