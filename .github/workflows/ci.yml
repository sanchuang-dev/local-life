# Workspace CI: install once, then lint, typecheck, API tests and all builds.
# Branch deployments stay in preview.yml; this workflow never deploys.
name: Workspace CI

on:
  push:
    branches: [dev, test, prod]
  pull_request:
    branches: [dev, test, prod, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
